<html>
	<head>
		<title>nested ordered list</title>
	</head>
	<body>
		<h1>Nested ordered list</h1>
		<ol>
			<li>Fruits</li>
				<ul>
					<li>Apple</li>
					<li>Banana</li>
					<li>Orange</li>
					<li>Mango</li>
					<li>Gauva</li>
				</ul>
			<li>Vegetables</li>
				<ol>
					<li>Potato</li>
					<li>Onion</li>
					<li>Chilli</li>
					<li>Cabbage</li>
					<li>Carrot</li>
				</ol>
		</ol>
	</body>
</html>
