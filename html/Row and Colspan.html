html>
    <head>
        <title>row and colspan</title>
    </head>
    <body>
        <table border = "1" width = "100%" height = "100%">
            <tr>
                <td>1</td>
                <td colspan = "2">2</td>
            </tr>
            
            <tr>
                <td>3</td>
                <td colspan = "2" rowspan = "2">4</td>
            </tr>
            
            <tr>  
                <td>5</td>
            </tr>
            
            <tr>
                <td colspan = "3">6</td>
            </tr>
        </table>
    </body>
</html>
